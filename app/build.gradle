plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.smashkarts.arena'
    compileSdk 34

    defaultConfig {
        applicationId "com.smashkarts.arena"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    aaptOptions {
        noCompress 'filamat', 'ktx', 'glb', 'gltf'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    // Google Filament PBR 3D Engine (ACES Tone Mapping, Bloom, Shadows, GLB Loader)
    implementation 'com.google.android.filament:filament-android:1.57.1'
    implementation 'com.google.android.filament:filament-utils-android:1.57.1'
    implementation 'com.google.android.filament:gltfio-android:1.57.1'
}
